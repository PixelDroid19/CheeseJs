name: Build/release

on:
  push:
    branches:
      - master
      - main
      - 'feature/python-experimental-support'
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: 'Upload build artifacts'
        required: false
        default: true
        type: boolean

jobs:
  # Quality checks job - runs on all pushes and PRs
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install Linux native WebView dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev pkg-config

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security Audit
        run: pnpm audit --audit-level=moderate
        continue-on-error: true

      - name: Native prerequisite check
        run: pnpm run native:check

      - name: Native manifest validation
        run: pnpm run native:validate

      - name: Native environment doctor
        run: pnpm run native:doctor

      - name: Quality gate
        run: pnpm run lint && pnpm run arch:check && pnpm run format:check && pnpm run type-check && pnpm run test:coverage && pnpm run native:test

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  native-platforms:
    needs: quality
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    env:
      NODE_OPTIONS: --max-old-space-size=6144

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install Linux native WebView dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev pkg-config

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate native manifest
        run: pnpm run native:validate

      - name: Native environment doctor
        run: pnpm run native:doctor

      - name: Build and package native app
        run: pnpm run package:native

      - name: Verify native package artifact
        run: pnpm run native:package:check

      - name: Bundle budget check
        run: pnpm run bundle:check

  # Build job - runs after quality checks pass
  release:
    needs: [quality, native-platforms]
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    env:
      NODE_OPTIONS: --max-old-space-size=6144

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install Linux native WebView dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev pkg-config

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate native manifest
        run: pnpm run native:validate

      - name: Native environment doctor
        run: pnpm run native:doctor

      - name: Build and package Zero Native app
        run: pnpm run package:native

      - name: Verify native package artifact
        run: pnpm run native:package:check

      - name: Bundle budget check
        run: pnpm run bundle:check

      - name: Upload Beta Artifacts
        if: github.ref == 'refs/heads/feature/python-experimental-support'
        uses: actions/upload-artifact@v4
        with:
          name: beta-native-${{ matrix.os }}
          path: |
            release/**
            zig-out/bin/**
          retention-days: 30

      - name: Upload Build Artifacts (Manual/Push)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
        uses: actions/upload-artifact@v4
        with:
          name: native-build-${{ matrix.os }}
          path: |
            release/**
            zig-out/bin/**
          retention-days: 14
